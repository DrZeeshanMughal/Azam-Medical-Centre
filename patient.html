<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Report - Azam Medical</title><style>body{font-family:system-ui;background:#f1f5f9;padding:12px}.card{max-width:700px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 6px 20px #0001}img{max-width:100%;border-radius:10px;margin:6px 0;border:1px solid #ddd}.ayat{background:#0f4a8a;color:#fff;text-align:center;padding:10px;font-family:serif;font-size:20px;border-radius:10px;margin-bottom:12px}</style></head><body><div class="card"><div class="ayat">وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ</div><h2 style="color:#1e40af;margin:0">Azam Medical Centre</h2><p style="font-size:12px;color:#64748b">Plot No.27, new 460 street, Allama Iqbal road, Manzoor Colony, Karachi | 02135386116<br>Dr. Muhammad Zeeshan (MBBS, RMP, Sonologist) | 4PM-10PM</p><hr><div id="out">Loading...</div></div>
<script>
let dbReq=indexedDB.open('AzamMedicalDB_v2',1);let db;dbReq.onsuccess=e=>{db=e.target.result;load()};
function load(){let urlM=new URLSearchParams(location.search).get('m');let m=urlM||localStorage.getItem('temp_mobile')||prompt('Apna Mobile Number Dalain');if(!m){document.getElementById('out').innerHTML='Mobile number zaruri hai';return;}let tx=db.transaction('patients','readonly');tx.objectStore('patients').getAll().onsuccess=ev=>{let all=ev.target.result||[];let found=all.filter(x=>x.mobile.replace(/\D/g,'').slice(-10)===m.replace(/\D/g,'').slice(-10)).reverse();if(!found.length){document.getElementById('out').innerHTML='No record found for '+m+'<br><br>Please contact clinic: 02135386116';return;}let p=found[0];document.getElementById('out').innerHTML=`<b>Name:</b> ${p.name}<br><b>Mobile:</b> ${p.mobile}<br><b>Age:</b> ${p.age} | <b>Gender:</b> ${p.gender}<br><b>Checkup:</b> ${p.vdate||'-'} | <b>Follow Up:</b> <span style="color:#dc2626;font-weight:700">${p.fdate||'-'}</span><br><br><b>Diagnosis:</b><br>${p.diag||'-'}<br><br><b>Medicines:</b><br>${p.med||'-'}<br><br>${p.presImg?`<b>Prescription:</b><br><img src="${p.presImg}">`:''}<br><b>Test Reports:</b><br>${(p.reports||[]).map(r=>`<img src="${r}">`).join('')}`; };}
</script></body></html>
