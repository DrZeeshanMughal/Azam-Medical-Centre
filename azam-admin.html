<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azam Medical - Admin</title>
<style>
body{font-family:system-ui;background:#f4f7fb;margin:0;padding:12px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 4px 15px rgba(0,0,0,.07);margin-bottom:14px;max-width:600px;margin-inline:auto}
h2{color:#1e4a8a;text-align:center;margin:6px 0}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #d0d8e6;border-radius:10px;font-size:15px;box-sizing:border-box}
label{font-weight:600;font-size:14px;margin-top:10px;display:block}
button{width:100%;padding:13px;background:#1e4a8a;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;margin-top:10px;cursor:pointer}
button.sec{background:#e8eef8;color:#1e4a8a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preview{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.preview img{width:75px;height:75px;object-fit:cover;border-radius:10px;border:1px solid #ddd}
.ptItem{border:1px solid #e1e7f0;border-radius:12px;padding:10px;margin:8px 0;background:#fafcff}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="card">
<h2>Azam Medical Centre - Admin</h2>
<div class="small" style="text-align:center">Plot No.27, Manzoor Colony | 4PM-10PM</div>
<label>Name</label><input id="name">
<label>Mobile (Patient ID)</label><input id="mobile" placeholder="0321...">
<div class="row"><div><label>Age</label><input id="age"></div><div><label>Gender</label><select id="gender"><option>Male</option><option>Female</option><option>Other</option></select></div></div>
<div class="row"><div><label>Checkup Date</label><input id="checkup" type="date"></div><div><label>Follow Up</label><input id="followup" type="date"></div></div>
<label>Diagnosis</label><textarea id="diagnosis" rows="2"></textarea>
<label>Medicines</label><textarea id="medicines" rows="3"></textarea>

<label>Prescription Pic (Camera)</label>
<input id="presImgInput" type="file" accept="image/*" capture="environment">
<div id="presPreviewWrap" class="preview"></div>

<label>Test Reports (Multiple)</label>
<input id="reportsInput" type="file" accept="image/*" multiple>
<div id="reportsPreviewWrap" class="preview"></div>

<button id="saveBtn">Save Patient</button>
<button class="sec" onclick="clearForm()">Clear / New</button>
</div>

<div class="card">
<h3 style="margin:0 0 8px">Saved Patients</h3>
<input id="search" placeholder="Search name or mobile..." oninput="renderList()">
<div id="list"></div>
</div>

<script>
let DB, presImgData = null, reportsData = [];
let editId = null;

// IndexedDB Open
let req = indexedDB.open("AzamDB",1);
req.onupgradeneeded = e => { DB = e.target.result; if(!DB.objectStoreNames.contains("patients")) DB.createObjectStore("patients",{keyPath:"mobile"}) };
req.onsuccess = e => { DB = e.target.result; renderList(); };
req.onerror = e => alert("DB error");

// Auto Compress Function - Yahi asal kaam karega
function compressImage(file, callback){
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let maxW = 900;
      let ratio = Math.min(1, maxW / img.width);
      canvas.width = img.width * ratio;
      canvas.height = img.height * ratio;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const compressed = canvas.toDataURL('image/jpeg', 0.6); // 60% quality ~ 200-300KB
      callback(compressed);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// Prescription
document.getElementById('presImgInput').addEventListener('change', e=>{
  let f = e.target.files[0]; if(!f) return;
  compressImage(f, res=>{
    presImgData = res;
    document.getElementById('presPreviewWrap').innerHTML = `<img src="${res}"><span class="small">Compressed: ${Math.round(res.length/1024)}KB</span>`;
  });
});

// Reports
document.getElementById('reportsInput').addEventListener('change', e=>{
  [...e.target.files].forEach(f=>{
    compressImage(f, res=>{
      reportsData.push(res);
      let im = document.createElement('img'); im.src = res;
      document.getElementById('reportsPreviewWrap').appendChild(im);
    });
  });
});

// Save
document.getElementById('saveBtn').onclick = ()=>{
  let name=document.getElementById('name').value.trim();
  let mobile=document.getElementById('mobile').value.trim();
  if(!name||!mobile){alert("Name & Mobile lazmi hai"); return;}
  let data={
    name, mobile,
    age:document.getElementById('age').value,
    gender:document.getElementById('gender').value,
    checkup:document.getElementById('checkup').value,
    followup:document.getElementById('followup').value,
    diagnosis:document.getElementById('diagnosis').value,
    medicines:document.getElementById('medicines').value,
    presImg: presImgData,
    reports: reportsData,
    created: new Date().toISOString()
  };
  let tx = DB.transaction("patients","readwrite");
  tx.objectStore("patients").put(data);
  tx.oncomplete = ()=>{ alert("Saved! Ab patient ko link bhej den"); clearForm(); renderList(); };
};

function renderList(){
  let q = document.getElementById('search').value.toLowerCase();
  let tx = DB.transaction("patients","readonly");
  let store = tx.objectStore("patients");
  let out = "";
  store.openCursor().onsuccess = e=>{
    let cur = e.target.result;
    if(cur){
      let p = cur.value;
      if(!q || p.name.toLowerCase().includes(q) || p.mobile.includes(q)){
        let link = `https://drzeeshanmughal.github.io/Azam-Medical-Centre/patient.html?m=${p.mobile}`;
        out += `<div class="ptItem"><b>${p.name}</b> - ${p.mobile}<br><span class="small">${p.diagnosis||""} | ${p.checkup||""}</span><br>
        <div class="row"><button class="sec" style="padding:8px" onclick="editPat('${p.mobile}')">Edit</button><button class="sec" style="padding:8px" onclick="sharePat('${link}')">WhatsApp</button></div>
        <a href="${link}" target="_blank" class="small">${link}</a></div>`;
      }
      cur.continue();
    } else { document.getElementById('list').innerHTML = out || "No record"; }
  };
}

function editPat(mob){
  let tx = DB.transaction("patients","readonly");
  tx.objectStore("patients").get(mob).onsuccess = e=>{
    let p = e.target.result; if(!p) return;
    document.getElementById('name').value=p.name; document.getElementById('mobile').value=p.mobile;
    document.getElementById('age').value=p.age; document.getElementById('gender').value=p.gender;
    document.getElementById('checkup').value=p.checkup; document.getElementById('followup').value=p.followup;
    document.getElementById('diagnosis').value=p.diagnosis; document.getElementById('medicines').value=p.medicines;
    presImgData = p.presImg; reportsData = p.reports||[];
    document.getElementById('presPreviewWrap').innerHTML = p.presImg?`<img src="${p.presImg}">`:"";
    document.getElementById('reportsPreviewWrap').innerHTML = (p.reports||[]).map(r=>`<img src="${r}">`).join("");
    window.scrollTo(0,0);
  };
}

function sharePat(link){ window.open(`https://wa.me/?text=${encodeURIComponent("Azam Medical Centre - Aapki prescription: "+link)}`,"_blank"); }
function clearForm(){ document.querySelectorAll('input,textarea').forEach(i=>{ if(i.id!=='search') i.value=''; }); presImgData=null; reportsData=[]; document.getElementById('presPreviewWrap').innerHTML=''; document.getElementById('reportsPreviewWrap').innerHTML=''; }
</script>
</body>
</html>
