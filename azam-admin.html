<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Azam Medical</title>
<style>body{font-family:system-ui;background:#f1f5f9;margin:0;padding:12px}.card{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:14px;box-shadow:0 6px 20px #0001}.row{display:flex;gap:8px}.row>*{flex:1}label{font-weight:700;font-size:13px;color:#1e40af;margin-top:12px;display:block}input,select,textarea{width:100%;padding:11px;margin:4px 0;border:1px solid #cbd5e1;border-radius:8px;box-sizing:border-box}button{cursor:pointer}.btn{width:100%;padding:12px;border:0;border-radius:8px;font-weight:700;color:#fff;margin-top:10px}.blue{background:#1e40af}.cam{background:#0ea5e9;color:#fff;padding:7px 12px;border:0;border-radius:6px;font-size:12px;margin:2px}.gal{background:#8b5cf6;color:#fff;padding:7px 12px;border:0;border-radius:6px;font-size:12px;margin:2px}img.pre{max-width:100%;border-radius:8px;margin-top:6px;border:1px solid #ddd}</style></head><body>
<div class="card"><div style="display:flex;justify-content:space-between"><h2 style="color:#1e40af;margin:0">Azam Admin Panel</h2><button onclick="localStorage.removeItem('azam_login');location.href='index.html'" style="background:#334155;color:#fff;padding:6px 12px;border-radius:20px;border:0">Logout</button></div>
<label>1. Patient Name *</label><div class="row"><input id="pName" placeholder="Full Name"><input id="pMobile" placeholder="WhatsApp No e.g. 03001234567"></div>
<div class="row"><div><label>2. Gender</label><select id="pGender"><option value="">Select</option><option>Male</option><option>Female</option><option>Child</option></select></div><div><label>3. Age (Full Keyboard)</label><input id="pAge" type="text" placeholder="e.g. 13 days / 6 Months / 25 Years"></div></div>
<div class="row"><div><label>5. Date of Checkup</label><input id="pVdate" type="date"></div><div><label>6. Follow Up Date</label><input id="pFdate" type="date"></div></div>
<label>4. Diagnosis & Complaints</label><textarea id="pDiag" rows="2"></textarea>
<label>7. Prescription + Picture (Highly Compressed)</label><textarea id="pMed" rows="2"></textarea><div><button class="cam" onclick="presCam.click()">📷 Camera</button><button class="gal" onclick="presGal.click()">🖼️ Gallery</button></div><input type="file" id="presCam" accept="image/*" capture="environment" style="display:none"><input type="file" id="presGal" accept="image/*" style="display:none"><img id="presPrev" class="pre" style="display:none"><small id="presSt" style="color:green"></small>
<label>8. Test Reports - Auto Compressed (4 max)</label><div><button class="cam" onclick="repCam.click()">📷 Camera</button><button class="gal" onclick="repGal.click()">🖼️ Gallery</button></div><input type="file" id="repCam" accept="image/*" capture="environment" style="display:none"><input type="file" id="repGal" accept="image/*" multiple style="display:none"><div id="repPrev" style="display:flex;gap:6px;flex-wrap:wrap"></div><small id="repSt" style="color:green"></small>
<button id="saveBtn" class="btn blue" onclick="saveData()">Save Patient + Send WhatsApp</button>
<button id="cancelBtn" class="btn" style="background:#64748b;display:none" onclick="cancelEdit()">Cancel Edit</button>
<hr><label>Patient Records</label><input id="search" placeholder="Name ya Mobile se search" onkeyup="showList()"><div id="list"></div>
</div>
<script>
if(localStorage.getItem('azam_login')!=='1'){location.href='index.html'}
let editingId=null,presB64='',repsB64=[],oldPres='',oldReps=[],db;
let dbReq=indexedDB.open('AzamMedicalDB_v2',1);
dbReq.onupgradeneeded=e=>{e.target.result.createObjectStore('patients',{keyPath:'id'})};
dbReq.onsuccess=e=>{db=e.target.result;showList()};
function compressFile(file){return new Promise(res=>{let r=new FileReader();r.onload=ev=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let MAX=500;let w=img.width,h=img.height;if(w>h){if(w>MAX){h*=MAX/w;w=MAX}}else{if(h>MAX){w*=MAX/h;h=MAX}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.35))};img.onerror=()=>res(ev.target.result);img.src=ev.target.result};r.readAsDataURL(file)})}
async function handlePres(f){presSt.textContent='Compressing...';presB64=await compressFile(f);presPrev.src=presB64;presPrev.style.display='block';presSt.textContent='✓ Compressed '+Math.round(presB64.length/1024)+'KB'}
async function handleReps(files){repSt.textContent='Compressing...';repsB64=[];repPrev.innerHTML='';let arr=Array.from(files).slice(0,4);for(let ff of arr){let b=await compressFile(ff);repsB64.push(b);repPrev.innerHTML+=`<img src="${b}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd">`}repSt.textContent=`✓ ${repsB64.length} Compressed`}
presCam.addEventListener('change',e=>{if(e.target.files[0]) handlePres(e.target.files[0])});presGal.addEventListener('change',e=>{if(e.target.files[0]) handlePres(e.target.files[0])});repCam.addEventListener('change',e=>{if(e.target.files[0]) handleReps([e.target.files[0]])});repGal.addEventListener('change',e=>{handleReps(e.target.files)});
function saveData(){let n=pName.value.trim(),m=pMobile.value.trim();if(!n||!m){alert('Name & Mobile zaruri');return;}let p={id:editingId||Date.now(),name:n,mobile:m,gender:pGender.value,age:pAge.value,vdate:pVdate.value,fdate:pFdate.value,diag:pDiag.value,med:pMed.value,presImg:presB64||oldPres,reports:repsB64.length?repsB64:oldReps};let tx=db.transaction('patients','readwrite');tx.objectStore('patients').put(p);tx.oncomplete=()=>{let link=location.origin+'/patient.html?m='+encodeURIComponent(m);let msg=`Assalamualaikum ${n}, Azam Medical Centre se aapka checkup ho gaya. Follow up: ${p.fdate||'-'}. Report: ${link} - Dr Zeeshan (02135386116)`;let waNum=m.replace(/\D/g,'');if(waNum.startsWith('0')) waNum='92'+waNum.slice(1);window.open(`https://wa.me/${waNum}?text=${encodeURIComponent(msg)}`,'_blank');cancelEdit();showList();alert('✅ Done! Patient Saved & WhatsApp Ready');};}
function showList(){if(!db)return;let tx=db.transaction('patients','readonly');tx.objectStore('patients').getAll().onsuccess=e=>{let all=e.target.result||[];let s=(search.value||'').toLowerCase();let f=all.filter(x=>(x.name&&x.name.toLowerCase().includes(s))||(x.mobile&&x.mobile.includes(s))).reverse();list.innerHTML=f.map(x=>`<div style="border:1px solid #e2e8f0;padding:12px;border-radius:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center"><div><b>${x.name}</b> - ${x.mobile}<br><small>${x.age||''} | Follow: ${x.fdate||'-'}</small></div><div style="display:flex;flex-direction:column;gap:4px"><button onclick="viewData(${x.id})" style="background:#1e40af;color:#fff;border:0;padding:6px 14px;border-radius:6px;font-size:12px">View</button><button onclick="editData(${x.id})" style="background:#f59e0b;color:#fff;border:0;padding:6px 14px;border-radius:6px;font-size:12px">Edit</button><button onclick="delData(${x.id})" style="background:#ef4444;color:#fff;border:0;padding:6px 14px;border-radius:6px;font-size:12px">Delet</button></div></div>`).join('')}}
function viewData(id){db.transaction('patients','readonly').objectStore('patients').get(id).onsuccess=e=>{let p=e.target.result;window.open('patient.html?m='+encodeURIComponent(p.mobile),'_blank');}}
function editData(id){db.transaction('patients','readonly').objectStore('patients').get(id).onsuccess=e=>{let p=e.target.result;editingId=id;pName.value=p.name;pMobile.value=p.mobile;pGender.value=p.gender;pAge.value=p.age;pVdate.value=p.vdate;pFdate.value=p.fdate;pDiag.value=p.diag;pMed.value=p.med;oldPres=p.presImg||'';oldReps=p.reports||[];presB64='';repsB64=[];if(oldPres){presPrev.src=oldPres;presPrev.style.display='block'}if(oldReps.length){repPrev.innerHTML=oldReps.map(r=>`<img src="${r}" style="width:80px;height:80px;object-fit:cover;border-radius:8px">`).join('')}saveBtn.textContent='Update Patient';cancelBtn.style.display='block';window.scrollTo(0,0)}}
function delData(id){if(confirm('Delete?')){db.transaction('patients','readwrite').objectStore('patients').delete(id).onsuccess=showList}}
function cancelEdit(){editingId=null;presB64='';repsB64=[];oldPres='';oldReps='';['pName','pMobile','pAge','pGender','pVdate','pFdate','pDiag','pMed'].forEach(i=>document.getElementById(i).value='');presPrev.style.display='none';repPrev.innerHTML='';presSt.textContent='';repSt.textContent='';saveBtn.textContent='Save Patient + Send WhatsApp';cancelBtn.style.display='none';pVdate.valueAsDate=new Date()}
pVdate.valueAsDate=new Date();
</script></body></html>
